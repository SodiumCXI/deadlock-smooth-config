name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: gh release upload "${{ github.event.release.tag_name }}" gameinfo.gi --clobber
        env:
          GH_TOKEN: ${{ github.token }}
