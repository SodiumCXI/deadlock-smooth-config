name: Release

on:
  push:
    branches: [main]
    paths: [gameinfo.gi]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: gh release create "v${{ github.run_number }}" gameinfo.gi --title "v${{ github.run_number }}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
